<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="description" content="OXO Player - IPTV Player for Samsung TV"/>
    <title>OXO Player</title>
    
    <!-- Tizen APIs -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            width: 1920px;
            height: 1080px;

            background: #0a0a0a;
            font-family: 'Samsung One', 'Roboto', sans-serif;

        #root {
            width: 100%;
            height: 100%;
        }
        /* Focus visible pour navigation TV */
        :focus {
            outline: 3px solid #E50914 !important;
            outline-offset: 2px;
        }

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
